name: nightly-interop

# Nightly Android↔iOS interop verification.
#
# iOS interop is covered by pre-baked sealed-sender fixtures checked into
# `app/src/androidTest/assets/ios-fixtures/` (see M6 Phase 5). Those
# fixtures are regenerated by the iOS test suite whenever the sealed-sender
# certificate format or envelope wire shape changes. If the Android
# instrumented interop test deserialises and decrypts them successfully,
# the two platforms agree on the shared crypto wire format.
#
# The backend is booted in-job from `sanchr-backend` — the canonical
# backend repo is cloned to a sibling workspace and its top-level
# `docker-compose.yml` is brought up to provide the integration harness.
# If the backend repo ever
# publishes a tagged Docker image of the test harness, this workflow can
# switch to a pull — tracked as a post-M6 follow-up in the plan doc.

on:
  schedule:
    # 04:00 UTC daily — low-traffic window for the shared CI runner pool.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'sanchr-backend ref to use (default: main)'
        required: false
        default: 'main'

concurrency:
  group: nightly-interop
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  interop:
    name: Android ↔ iOS fixture interop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: sanchr-android

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ZynclaveTech/sanchr-backend
          # main, not a feature branch. This was pinned to
          # feat/persistent-refresh-tokens, which has since been merged and
          # deleted — so every nightly run failed here, before a single test,
          # and filed an issue saying interop had regressed. It had not: the
          # suite never ran at all.
          ref: ${{ github.event.inputs.backend_ref || 'main' }}
          # Private repo: the default GITHUB_TOKEN cannot read it. Same secret
          # as android-ci's drift gate.
          token: ${{ secrets.BACKEND_READ_TOKEN }}
          path: sanchr-backend

      - name: Provision google-services.json
        uses: ./sanchr-android/.github/actions/google-services
        with:
          json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          app-dir: sanchr-android/app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: sanchr-android

      - name: Enable KVM on runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot backend test harness
        working-directory: sanchr-backend
        run: |
          docker compose up -d --wait
          # Emulator → host mapping: the interop test reads
          # `SANCHR_TEST_BACKEND_URL` (see AndroidIosInteropTest). 10.0.2.2
          # is the emulator's alias for the host; the default compose
          # listens on 50051 of localhost.
          echo "SANCHR_TEST_BACKEND_URL=http://10.0.2.2:50051" >> "$GITHUB_ENV"

      - name: Run interop instrumented test
        id: interop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: sanchr-android
          # One line, deliberately. The action does not run this through a
          # shell that honours backslash continuations, so a wrapped command
          # reaches Gradle with a literal `\` as an argument and fails with
          # "Task '\' not found" — which it did, invisibly, behind the
          # checkout failure that stopped this job ever getting here.
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.annotation=com.sanchr.app.interop.InteropTest -Pandroid.testInstrumentationRunnerArguments.backendUrl=$SANCHR_TEST_BACKEND_URL --no-daemon

      - name: Tear down backend
        if: always()
        working-directory: sanchr-backend
        run: docker compose logs > ../backend-compose.log 2>&1 || true; docker compose down -v

      - name: Upload interop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-interop-reports
          path: |
            sanchr-android/app/build/reports/androidTests/**
            sanchr-android/app/build/outputs/androidTest-results/**
            backend-compose.log
          retention-days: 30

      - name: Write check-run summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Android ↔ iOS interop green" >> "$GITHUB_STEP_SUMMARY"
            echo "Backend ref: ${{ github.event.inputs.backend_ref || 'main' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Android ↔ iOS interop FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "See the uploaded \`nightly-interop-reports\` artifact for JUnit XML + backend logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open / update failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          INTEROP_OUTCOME: ${{ steps.interop.outcome }}
          BACKEND_REF: ${{ github.event.inputs.backend_ref || 'main' }}
        with:
          script: |
            // A run that fell over before the suite started is not a wire
            // regression, and must not be reported as one — an issue saying
            // interop broke, when interop never ran, is worse than silence.
            const ranSuite = process.env.INTEROP_OUTCOME === 'failure';
            const date = new Date().toISOString().slice(0,10);
            const title = ranSuite
              ? `[nightly-interop] Android↔iOS interop failure on ${date}`
              : `[nightly-interop] run could not start on ${date}`;
            const body = [
              ranSuite
                ? `Nightly interop failed at run ${context.runId}.`
                : `Nightly interop could not run at ${context.runId}: it failed before the suite started (setup, backend checkout, or emulator). This is not evidence of an interop regression.`,
              ``,
              `- Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Backend ref: ${process.env.BACKEND_REF}`,
              `- Interop step outcome: ${process.env.INTEROP_OUTCOME || 'did not run'}`,
              ``,
              `Check the \`nightly-interop-reports\` artifact for JUnit output and backend compose logs.`,
              `Close this issue once resolved; a new issue opens on the next failure.`,
            ].join('\n');

            // De-dupe by exact title within the last 30 open issues.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'interop-regression',
              per_page: 30,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure: run ${context.runId}.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['interop-regression'],
              });
            }
