# Sanchr Android version manifest
#
# Monotonic — NEVER decrement `versionCode`. Play Console rejects any upload
# whose versionCode is ≤ the largest previously uploaded versionCode, even
# on a separate track. Bumping rules:
#
#   • Hotfix / internal iteration that reuses the same versionName: bump
#     versionCode by 1.
#   • Minor / major SemVer bump: bump versionCode by 1, update versionName
#     (MAJOR.MINOR.PATCH).
#
# CI may override both values via `SANCHR_VERSION_CODE` /
# `SANCHR_VERSION_NAME` env vars (see `app/build.gradle.kts`). When that
# happens, keep this file updated in the same commit so the checked-in
# history matches what shipped.
#
# Update `CHANGELOG.md` AND create
# `fastlane/metadata/android/en-US/changelogs/<versionCode>.txt` in the same
# commit that bumps this file.
versionCode=1
versionName=1.0.0
